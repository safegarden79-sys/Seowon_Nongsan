<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>SEOWONY</title>
<meta name="apple-mobile-web-app-title" content="SEOWONY">
<meta name="application-name" content="SEOWONY">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  /* 하양 기본 테마. 글자는 밝은 배경에서 잘 읽히도록 진하게 둔다. */
  --bg:#FFFFFF;
  --surface:#F5F6F8;
  --surface2:#E9ECF0;
  --line:#D3D8DE;
  --text:#1B1F24;
  --muted:#4F5761;
  --dim:#7D858F;
  --ok:#1E9E53;
  --warn:#F0A020;
  --hot:#D64545;
  --accent:#A35F00;     /* 강조 글자(단가·소계·품목명) — 하양 위에서 읽히는 진한 주황 */
  --num:#1F64A8;        /* 원표 번호 */
  --seoul:#DCEBFF;      /* 서울청과 줄 배경 (파랑) */
  --seoul-edge:#3B7DD8;
  --dong:#E3F6CF;       /* 동화청과 줄 배경 (연두) */
  --dong-edge:#6BB52A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
  padding-bottom:88px;-webkit-text-size-adjust:100%;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.tnum{font-variant-numeric:tabular-nums}
button{font-family:inherit}

header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 16px 0}
.brand{font-size:23px;font-weight:800;text-align:center;margin:0;color:var(--text);letter-spacing:.01em}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--dim);font-weight:600;margin:0}
h1{font-size:20px;margin:2px 0 0;color:var(--text)}
.headrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.big{font-size:30px;font-weight:800;line-height:1;color:var(--text)}
.biglab{font-size:13px;color:var(--muted);margin-left:3px}
.sub{font-size:11px;color:var(--dim);margin:5px 0 0;text-align:right}
.bar{height:6px;border-radius:99px;background:#E4E7EB;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--ok);transition:width .3s}

.tabs{display:flex;gap:4px;margin-top:8px}
.tab{flex:1;padding:10px 8px;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--dim);font-size:14px;font-weight:700}
.tab.on{color:var(--text);border-bottom-color:var(--warn)}

.searchwrap{position:relative;margin-top:12px}
input[type=search],textarea,input[type=text],input[type=number],select{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:11px 34px 11px 34px;color:var(--text);font-size:14px;font-family:inherit;
  appearance:none;-webkit-appearance:none}
textarea,input[type=text],input[type=number],select{padding:11px 12px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--warn)}
input::placeholder,textarea::placeholder{color:var(--dim)}
.sicon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:15px}
.sclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);font-size:16px;padding:6px 8px}

.chips{display:flex;gap:6px;margin-top:10px;padding-bottom:12px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:9px;font-size:12px;font-weight:600;
  background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.chip.on{background:var(--ok);border-color:var(--ok);color:#FFFFFF}
.chip.mode.on{background:var(--surface2);border-color:#9AA1A9;color:var(--text)}
.div{width:1px;height:20px;background:var(--line);flex:0 0 auto;margin:0 4px;align-self:center}

main{padding:16px}
.panelbtn{width:100%;display:flex;align-items:center;gap:9px;padding:13px 14px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line);color:var(--text);
  font-size:14px;font-weight:600;text-align:left;margin-bottom:8px}
.panelbtn .arrow{margin-left:auto;color:var(--muted);font-size:12px}
.panel{border-radius:12px;background:var(--surface);border:1px solid var(--line);
  padding:14px;margin-bottom:8px;font-size:13px;line-height:1.55}
.acc{margin-bottom:12px}
.m{font-weight:700;color:var(--text)}
.n{color:var(--ok);font-weight:700}
.meta{color:var(--muted);font-size:12px;margin:4px 0 0}
.spot{color:var(--text);font-size:12px;margin:2px 0 0;opacity:.85}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.warnt{color:var(--hot);font-weight:700;margin:8px 0 4px}
.li{color:var(--muted);font-size:12px;margin:3px 0}
.wn{margin-bottom:10px}
.wn b{color:#4E7A00;font-size:12px;display:block}
.wn span{color:var(--text);font-size:13px;opacity:.9}

section{margin-bottom:20px}
.shead{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:0;margin:0 0 8px}
.tick{width:4px;height:16px;border-radius:99px;flex:0 0 auto}
.stitle{font-size:14px;font-weight:800;color:var(--text)}
.scount{font-size:11px;color:var(--dim)}
.sline{flex:1;height:1px;background:var(--line)}
.sarrow{color:var(--dim);font-size:11px}

.card{border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px;overflow:hidden}
.card.done{background:rgba(107,203,139,.09);border-color:rgba(107,203,139,.35)}
.row{display:flex;align-items:flex-start}
.cbx{padding:14px 4px 14px 14px;background:none;border:0}
.box{width:28px;height:28px;border-radius:9px;border:2px solid #9AA1A9;display:flex;align-items:center;justify-content:center;color:transparent;font-size:16px;font-weight:900}
.card.done .box{background:var(--ok);border-color:var(--ok);color:#FFFFFF}
.body{flex:1;min-width:0;padding:14px 8px 14px 0;background:none;border:0;text-align:left}
.title{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.name{font-size:15px;font-weight:800;color:var(--text)}
.card.done .name{color:var(--dim);text-decoration:line-through}
.plate{font-size:13px;font-weight:800;padding:2px 7px;border-radius:7px;border:1px solid}
.card.done .plate{border-color:var(--line)!important;color:var(--dim)!important}
.tag{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px}
.tag.time{background:rgba(232,163,61,.18);color:var(--accent)}
.tag.flag{background:rgba(232,139,139,.18);color:#B83232}
.tag.grade{background:var(--surface2);color:var(--muted)}
.tag.rc{background:var(--surface2);color:var(--muted)}
.tag.fix{background:rgba(232,163,61,.2);color:var(--accent);border:1px solid rgba(232,163,61,.4)}
.card.done .tag{background:none;color:var(--dim)}
.loc{font-size:13px;color:var(--text);opacity:.85;margin:5px 0 0;line-height:1.4}
.memo{font-size:12px;color:var(--muted);margin:4px 0 0;line-height:1.4}
.card.done .loc,.card.done .memo{color:var(--dim);opacity:1}
.mynote{font-size:12px;color:var(--accent);margin:6px 0 0;line-height:1.4}
.notebtn{padding:14px 13px;background:none;border:0;color:var(--dim);font-size:15px}
.editor{padding:0 14px 14px}
.editor textarea{padding:9px 12px;border-radius:10px;background:#FFFFFF;font-size:13px;min-height:56px;resize:vertical}
.ebtns{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.ebtn{padding:7px 12px;border-radius:9px;font-size:12px;font-weight:700;border:0}
.ebtn.g{background:var(--surface2);color:var(--muted)}
.ebtn.r{background:rgba(232,139,139,.2);color:#B83232}
.ebtn.y{background:var(--warn);color:#2A2116}

/* 낙찰 카드 */
.lot .body{padding-right:4px}
/* 한 줄 표 */
.kindwrap{margin:0 0 12px 12px}
.kindhead{display:flex;align-items:baseline;gap:8px;margin:8px 0 4px}
.kindname{font-size:13px;font-weight:800;color:var(--text)}
.kindsum{font-size:11px;color:var(--accent);flex:1}
.lhead,.lrow{display:grid;align-items:center;
  /* 숫자 칸은 들어갈 만큼만 주고 남는 자리를 품목·생산자에 몰아준다.
     좁은 안드로이드 화면(360px)에서도 글자가 잘리지 않게 하기 위함이다. */
  grid-template-columns:16px minmax(0,1.25fr) 38px minmax(0,1.3fr) 24px 22px 28px minmax(50px,auto) 18px;
  gap:3px}
.lhead{font-size:9px;color:var(--dim);padding:0 6px 3px;letter-spacing:-.02em}
.lhead span{text-align:center;overflow:hidden}
.lhead .c-item,.lhead .c-who{text-align:left}
.lhead .c-qty,.lhead .c-amt{text-align:right}
.card.lotrow{border-radius:10px;margin-bottom:4px}
.lrow{padding:9px 5px;font-size:12px;line-height:1.25}
.lrow>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
/* 품목과 생산자는 자르지 않는다. 자리가 모자라면 줄을 접어서라도 다 보여준다.
   '고추(오이맛)' 처럼 띄어쓰기가 없는 이름도 접히도록 anywhere 를 함께 준다. */
.lrow>.c-item,.lrow>.c-who{white-space:normal;text-overflow:clip;
  word-break:keep-all;overflow-wrap:anywhere}
/* 아주 좁은 화면(320px 같은 옛 기기)에서는 숫자 칸을 한 번 더 줄여
   품목·생산자가 한 줄에 들어가게 한다. */
@media (max-width:360px){
  .lhead,.lrow{grid-template-columns:15px minmax(0,1.25fr) 32px minmax(0,1.3fr) 24px 20px 26px minmax(44px,auto) 16px;
    gap:2px}
  .lrow{padding:9px 3px;font-size:11.5px}
  .lhead{padding:0 3px 3px}
  .c-no,.c-amt{font-size:9px}
  .lbox{width:15px;height:15px}
}
.lbox{width:16px;height:16px;border-radius:5px;border:1.5px solid #9AA1A9;display:flex;
  align-items:center;justify-content:center;font-size:11px;font-weight:900;color:transparent}
.card.lotrow.done .lbox{background:var(--ok);border-color:var(--ok);color:#FFFFFF}
.c-item{text-align:left!important;font-weight:800;color:var(--text)}
.c-noitem{color:var(--warn)}                 /* 품목을 못 읽은 줄 — 직접 채워야 한다 */
.c-no{font-size:10px;color:var(--num);letter-spacing:-.03em}
.c-who{text-align:left!important;color:var(--text)}
.c-unit,.c-grade{color:var(--muted)}
.c-grade{font-weight:700;color:var(--accent)}
.c-qty{text-align:right!important;font-weight:800;color:var(--text)}
/* 생산자와 수량은 물건을 챙기며 제일 자주 보는 값이라 두 포인트 크게, 굵게 한다.
   머리글 라벨은 그대로 두고 값에만 준다. */
.lrow>.c-who,.lrow>.c-qty{font-size:14px;font-weight:800}
.c-amt{text-align:right!important;color:var(--muted);font-size:10px;letter-spacing:-.03em}
.c-add{background:none;border:0;color:var(--warn);font-size:16px;font-weight:700;padding:0;line-height:1}
.card.lotrow.done .c-item,.card.lotrow.done .c-qty{color:var(--dim)}
.card.lotrow.done .lrow{opacity:.72}
.lnote{font-size:11px;color:var(--accent);padding:0 8px 8px 28px;display:flex;gap:8px}
.lnote .lby{color:var(--dim);margin-left:auto;white-space:nowrap}
.cathead{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:0;
  margin:12px 0 6px 10px;font-family:inherit}
.catname{font-size:13px;font-weight:800;color:var(--accent)}
.wholevel{padding-left:10px;border-left:1px solid var(--line);margin-left:12px}
.subhead{display:flex;align-items:center;gap:8px;margin:9px 0 5px 2px}
.subname{font-size:13px;font-weight:700;color:var(--text)}
.tag.size{background:var(--surface2);color:var(--muted);font-weight:700}
.subcount{font-size:11px;color:var(--dim)}
.full{color:var(--ok)!important;font-weight:700}
.qty{display:flex;align-items:center;gap:2px;padding:12px 12px 12px 0}
.qbtn{width:30px;height:30px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);
  color:var(--text);font-size:16px;font-weight:700;line-height:1}
.qnum{min-width:52px;text-align:center;font-size:13px;font-weight:800;color:var(--text)}
.qnum small{color:var(--dim);font-weight:600}
.money{font-size:12px;color:var(--muted);margin:4px 0 0}
.money b{color:var(--accent);font-weight:700}


.formrow{display:flex;gap:8px;margin-bottom:8px}
.formrow>*{flex:1;min-width:0}
label.fl{font-size:11px;color:var(--dim);display:block;margin:0 0 4px}
.bigbtn{width:100%;padding:13px;border-radius:12px;font-size:14px;font-weight:800;border:1px solid var(--line);
  background:var(--surface2);color:var(--text);margin-bottom:8px}
.bigbtn.danger{background:var(--hot);border-color:var(--hot);color:#FFFFFF}
.bigbtn.accent{background:var(--warn);border-color:var(--warn);color:#2A2116}
.hint{font-size:12px;color:var(--dim);line-height:1.5;margin:2px 0 10px}

.empty{text-align:center;padding:44px 0;color:var(--muted);font-size:14px;line-height:1.6}
.empty button{margin-top:10px;background:none;border:0;color:var(--ok);font-size:14px;text-decoration:underline;text-underline-offset:4px}

footer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);padding:11px 16px calc(11px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:12px}
.saved{flex:1;min-width:0;font-size:11px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn{padding:9px 12px;border-radius:9px;font-size:12px;font-weight:700;
  background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.fbtn.bellon{background:#E8F7EE;border-color:#7CC99A;color:#16703A}
.fbtn.red{background:var(--hot);border-color:var(--hot);color:#FFFFFF}
.hidden{display:none!important}
.revmkt{flex:none;font-size:10px;font-weight:700;color:var(--dim);border:1px solid var(--line);
  border-radius:99px;padding:3px 7px;white-space:nowrap}
.updbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:90;padding:12px 14px;
  border-radius:12px;background:var(--warn);color:#2A2116;font-size:13px;font-weight:700;
  text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{flex:1}
.who{font-size:12px;font-weight:700;color:#2A2116;background:var(--warn);border-radius:99px;padding:4px 10px;white-space:nowrap}
.conn{font-size:11px;color:var(--dim);white-space:nowrap;min-width:52px;text-align:right}
/* 최상단 오른쪽 툴바 — 서울청과·동화청과 로그인 세션 (녹색 정상 · 빨강 만료 · 회색 수집기 신호 없음) */
.rtool{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.sessbar{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 8px}
.sess{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.sess i{width:10px;height:10px;border-radius:50%;background:#9AA1A9;display:block}
.sess.ok i{background:#2ECC71;box-shadow:0 0 6px rgba(46,204,113,.8)}
.sess.bad i{background:#FF4D4D;box-shadow:0 0 6px rgba(255,77,77,.8)}
.sess.bad{color:#C62828}
.sesscard{border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:12px 14px;margin-bottom:8px;font-size:13px;line-height:1.6}
.sesscard b{font-size:15px}
.sesscard .st{float:right;font-weight:800}
.sesscard .st.ok{color:#2ECC71}.sesscard .st.bad{color:#FF6B6B}.sesscard .st.none{color:var(--dim)}
.conn.on{color:var(--ok)}
.conn.off{color:var(--hot)}
.stampline{font-size:11px;color:var(--dim);margin:5px 0 0}
.stampline b{color:var(--accent);font-weight:700}
.pickbtn{display:inline-block;padding:12px 18px;margin:4px 6px 0 0;border-radius:12px;font-size:15px;font-weight:800;
  background:var(--surface2);border:1px solid var(--line);color:var(--text)}
.pickbtn.on{background:var(--warn);border-color:var(--warn);color:#2A2116}
.feed{border-radius:12px;background:var(--surface);border:1px solid var(--line);padding:10px 12px;margin-bottom:8px}
.feed div{font-size:12px;color:var(--muted);padding:3px 0}
.feed b{color:var(--text)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheethead b{font-size:17px}
/* 낙찰 내역 — 날짜 고르기 (동화청과 낙찰내역조회 화면과 같은 방식) */
.datebar{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.dtitle{font-size:18px;font-weight:800;color:var(--text);white-space:nowrap}
.datebtn{flex:1;min-width:0;padding:11px 12px;border-radius:12px;border:2px solid var(--ok);background:var(--surface);
  color:var(--text);font-size:16px;font-weight:700;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmodal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.dsheet{background:#FFFFFF;color:#222;border-radius:22px;width:100%;max-width:380px;padding:20px 18px 18px}
.dcols{display:flex;gap:8px}
.dcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.dlab{font-size:18px;color:#333;margin-bottom:4px}
.dcol button{background:none;border:0;font-size:24px;color:#333;padding:4px 18px;line-height:1}
.dval{width:100%;text-align:center;font-size:24px;padding:16px 0;border:1px solid #DDD;border-radius:6px;
  background:linear-gradient(#FFF,#EEE);color:#222;font-variant-numeric:tabular-nums}
.dsum{text-align:center;font-size:17px;color:#333;margin:18px 0 2px}
.dcnt{text-align:center;font-size:12px;color:#777;margin:0 0 16px;min-height:16px}
.dbtns{display:flex;gap:10px}
.dbtns button{flex:1;padding:14px 0;border-radius:99px;border:0;font-size:16px;font-weight:700}
.dclose{background:#DDD;color:#0B8A3E}
.dok{background:#0B8A3E;color:#FFF}
/* 낙찰 내역 표 — 재고 관리와 같은 엑셀식 표, 맨 아래 소계·합계 */
table.xl td.ck{width:30px;padding:0}
.ckb{width:30px;height:38px;background:none;border:0;display:flex;align-items:center;justify-content:center;padding:0}
.ckb i{width:18px;height:18px;border-radius:5px;border:1.5px solid #9AA1A9;display:flex;align-items:center;justify-content:center;
  font-style:normal;font-size:12px;font-weight:900;color:transparent}
tr.got .ckb i{background:var(--ok);border-color:var(--ok);color:#FFFFFF}
/* 재고 관리 — 체크(고정)한 줄 */
tr.locked .ckb i{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
table.xl tr.locked td{font-weight:600}

/* ==================== 낙찰 내역 기본값 (업로드한 경매 화면) ==================== */
/* 낙찰 내역은 기본으로 비어 있다. 실시간 수집기(poller) 또는 직접 추가로 채운다. */
const SEED_LOTS=[];

/* ==================== 낙찰 항목 식별 ====================
   같은 내용의 낙찰 줄은 언제 다시 불러와도 같은 id를 갖게 한다.
   → 목록을 새로 받아도 세어둔 박스 수가 그대로 따라붙는다. */
function lotKey(l){
  /* 같은 낙찰을 다시 읽어도 같은 줄로 알아보게 하는 열쇠.
     품목·생산자·등급은 인식이 자주 틀린다(실측: 같은 사람이 "박지혜"와 "박지"로 읽혔다).
     수량과 단가는 거래금액 ÷ 단가 검산을 통과한 값이라 가장 믿을 만하다.
     실제 19줄로 확인했을 때 이 조합만으로 모두 구분된다. */
  return "K|"+[l.mkt,l.date,l.no,l.qty,l.price].map(x=>String(x??"").trim()).join("|");
}
function withKeys(arr){
  const seen={};
  return arr.map(l=>{
    let k=lotKey(l);
    seen[k]=(seen[k]||0)+1;
    if(seen[k]>1) k+="#"+seen[k];      // 완전히 동일한 줄이 두 번 나오면 구분
    return Object.assign({},l,{id:k});
  });
}

/* ==================== 상태 ==================== */
const KEY="seowon-check-v2";
let state={done:{},notes:{},lots:null,got:{},savedAt:null};
let tab="lot", filter="all", groupMode="doc", query="", lotMkt="all";
let collapsed={}, openNote=null, confirmReset=false;

try{const raw=localStorage.getItem(KEY); if(raw) state=Object.assign(state,JSON.parse(raw));}catch(e){}
if(!state.lots) state.lots=SEED_LOTS.slice();
if(!state.got) state.got={};

/* 이전 버전에 들어있던 예시 낙찰 데이터를 한 번 정리한다 */
if(state.ver!==4){ state.lots=[]; state.got={}; state.ver=4; }

function save(){
  state.savedAt=new Date().toISOString();
  try{ localStorage.setItem(KEY,JSON.stringify(state)); }
  catch(e){ document.getElementById("saved").textContent="⚠ 저장공간 부족"; return false; }
  renderFooter(); return true;
}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const won=n=>Number(n||0).toLocaleString("ko-KR");

/* ==================== 차량 탭 ==================== */
function visibleStops(){
  const kw=query.trim().toLowerCase();
  return STOPS.filter(s=>{
    if(filter==="todo" && (!s.fix||state.done[s.id]))return false;
    if(filter==="done" && (!s.fix||!state.done[s.id]))return false;
    if(!kw)return true;
    return [s.name,s.car,s.loc,s.memo,s.time,state.notes[s.id]].filter(Boolean).join(" ").toLowerCase().includes(kw);
  });
}
function carGroups(vis){
  if(groupMode==="doc"){
    return SECTIONS.map(sec=>{const f=STOPS.find(s=>s.s===sec.key);
      return {key:sec.key,title:sec.title,tone:f?f.z.tone:"amber",items:vis.filter(s=>s.s===sec.key)};
    }).filter(g=>g.items.length);
  }
  return Object.keys(Z).map(k=>({key:Z[k].key,title:Z[k].label,tone:Z[k].tone,items:vis.filter(s=>s.z.key===Z[k].key)})).filter(g=>g.items.length);
}
function rcTag(rc){
  if(rc==="no")   return `<span class="tag flag">영수증 X</span>`;
  if(rc==="cash") return `<span class="tag flag">현금수령</span>`;
  return `<span class="tag rc">영수증 O</span>`;
}
function carCard(s){
  const d=!!state.done[s.id], t=TONE[s.z.tone], note=state.notes[s.id];
  return `<div class="card ${d?"done":""}" data-id="${s.id}">
    <div class="row">
      <button class="cbx" data-act="toggle" aria-label="완료"><span class="box">✓</span></button>

          ${s.time?`<span class="tag time">⏱ ${esc(s.time)}</span>`:""}

        ${s.memo?`<p class="memo">${esc(s.memo)}</p>`:""}

      <textarea id="ta-${s.id}" placeholder="현장 메모 (수량, 변경된 위치 등)">${esc(note||"")}</textarea>

    </div>`:""}</div>`;
}

/* ==================== 낙찰 탭 ==================== */
function visibleLots(){
  const kw=query.trim().toLowerCase();
  return state.lots.filter(l=>{
    if(lotMkt!=="all" && !l.mkt.startsWith(lotMkt)) return false;
    const g=state.got[l.id]||0;
    if(filter==="todo"&&g>=l.qty)return false;
    if(filter==="done"&&g<l.qty)return false;
    if(!kw)return true;
    return [l.item,l.who,l.no,l.grade,l.mkt].filter(Boolean).join(" ").toLowerCase().includes(kw);
  });
}
/* 낙찰 표의 한 줄. 서버의 오늘 작업 목록(state.lots)에 있는 줄만 챙김 체크·주석이 된다.

      <div class="ebtns"><button class="ebtn g" data-act="lncancel">닫기</button><button class="ebtn r" data-act="lotdel">이 줄 삭제</button><button class="ebtn y" data-act="lnsave">주석 저장</button></div>
    </td></tr>`:""}`;
}

/* 중분류 판정 — 품목명을 큰 갈래로 나눈다 */
const CATS=["파프리카·피망","고추","버섯","기타"];
function catOf(item){
  const t=item||"";
  if(/파프리카|피망/.test(t)) return "파프리카·피망";
  if(/고추|청양|꽈리|오이맛|녹광|홍초|아삭/.test(t)) return "고추";
  if(/버섯/.test(t)) return "버섯";
  return "기타";
}
const sumQty=rs=>rs.reduce((a,l)=>a+l.qty,0);
const sumGot=rs=>rs.reduce((a,l)=>a+Math.min(state.got[l.id]||0,l.qty),0);
const sumAmt=rs=>rs.reduce((a,l)=>a+l.price*l.qty,0);
const sizeKey=l=>(parseFloat(l.unit)||0)*100+({"특":1,"상":2,"중":3,"하":4}[l.grade]||0);

/* 시장 → 품목군 → 품종 (경매 화면의 품종별 소계와 같은 짜임새) */
function lotGroups(vis){
  const byMkt={};
  vis.forEach(l=>{ const m=l.mkt||"기타"; (byMkt[m]=byMkt[m]||[]).push(l); });
  const order=["서울청과","동화청과"];
  return Object.keys(byMkt)
    .sort((a,b)=>(order.indexOf(a)+1||9)-(order.indexOf(b)+1||9)||a.localeCompare(b,"ko"))
    .map(m=>{
      const rows=byMkt[m], byCat={};
      rows.forEach(l=>{ const c=catOf(l.item); (byCat[c]=byCat[c]||[]).push(l); });
      const cats=CATS.filter(c=>byCat[c]).map(c=>{
        const crows=byCat[c], byItem={};
        crows.forEach(l=>{ const k=(l.item||"품목 미상").trim(); (byItem[k]=byItem[k]||[]).push(l); });
        const kinds=Object.keys(byItem).sort((a,b)=>a.localeCompare(b,"ko")).map(k=>({
          key:`k:${m}:${k}`, title:k,
          rows:byItem[k].slice().sort((a,b)=>(a.who||"").localeCompare(b.who||"","ko")||sizeKey(a)-sizeKey(b)),
          qty:sumQty(byItem[k]), got:sumGot(byItem[k]), amt:sumAmt(byItem[k])
        }));
        return { key:`c:${m}:${c}`, title:c, kinds, qty:sumQty(crows), got:sumGot(crows), amt:sumAmt(crows) };
      });
      return { key:"m:"+m, title:m, tone:m.startsWith("서울")?"amber":"cyan",
               items:rows, cats, qty:sumQty(rows), got:sumGot(rows), amt:sumAmt(rows) };
    });
}

/* ==================== 낙찰 내역 — 날짜별 조회 ====================
   예전 캘린더 탭을 낙찰 내역 안으로 합쳤다. 위쪽 날짜를 누르면 동화청과 낙찰내역조회처럼
   년·월·일을 +/− 로 고르는 창이 뜨고, '날짜 선택 완료'를 누르면 그 날짜의 낙찰이 표로 나온다.
   한 날짜의 줄 = 서버 날짜별 기록(/api/history/날짜) + 오늘 작업 목록(state.lots)에서 그 날짜인 줄.
   오늘 작업 목록에 있는 줄은 챙김 체크·주석을 할 수 있고, 기록에만 남은 지난 줄은 보기 전용이다. */
let lotDate=null, lotDatePicked=false, calSummary=null, calDayCache={}, dayLoading=null;
async function loadCalSummary(){
  if(!serverUrl){ calSummary={}; return; }
  try{ const r=await fetch(serverUrl+"/api/history"); const j=await r.json(); calSummary=(j&&j.days)||{}; }
  catch(e){ calSummary=calSummary||{}; }
}
/* 하루치 기록을 받아온다. 받는 동안에는 이전에 받아둔 것을 그대로 보여준다. */
async function loadCalDay(date){
  if(!serverUrl){ calDayCache[date]=[]; return; }
  if(dayLoading===date) return;
  dayLoading=date;
  try{
    const r=await fetch(serverUrl+"/api/history/"+encodeURIComponent(date));
    const j=await r.json();
    calDayCache[date]=Object.values((j&&j.lots)||{});
  }catch(e){ calDayCache[date]=calDayCache[date]||[]; }
  if(dayLoading===date) dayLoading=null;
  if(tab==="lot"&&date===lotDate) render();
}
/* 날짜를 고르지 않았으면 오늘 작업 목록에서 가장 최근 경매일을 보여준다 */
function defaultLotDate(){
  const ds=(state.lots||[]).map(l=>l.date).filter(Boolean).sort();
  return ds.length?ds[ds.length-1]:경매일KST();
}
function dayRows(date){
  const by={};
  (calDayCache[date]||[]).forEach(l=>{ by[l.id]=Object.assign({},l); });
  (state.lots||[]).filter(l=>l.date===date).forEach(l=>{ by[l.id]=Object.assign({},l,{_live:true}); });
  return Object.values(by);
}
const dateKo=d=>`${d.slice(0,4)}년 ${d.slice(5,7)}월 ${d.slice(8,10)}일`;

function renderLots(chips){
  if(!lotDatePicked) lotDate=defaultLotDate();
  document.getElementById("datetxt").textContent=dateKo(lotDate);
  renderPoll();
  if(!(lotDate in calDayCache)) loadCalDay(lotDate);
  const all=dayRows(lotDate);
  const isDone=l=>l._live&&(state.got[l.id]||0)>=l.qty;
  const doneRows=all.filter(isDone).length;
  const pickRows=all.filter(isPick).length, reRows=all.filter(isReauc).length;
  chips.innerHTML=`
    <button class="chip ${filter==="all"?"on":""}" data-f="all">전체 ${all.length}</button>
    <button class="chip ${filter==="todo"?"on":""}" data-f="todo">미완료 ${all.length-doneRows}</button>
    <button class="chip ${filter==="done"?"on":""}" data-f="done">완료 ${doneRows}</button>
    <button class="chip ${filter==="pick"?"on":""}" data-f="pick">우선 픽업 ${pickRows}</button>
    <button class="chip ${filter==="re"?"on":""}" data-f="re">재경매 ${reRows}</button>
    <span class="div"></span>
    <button class="chip mode ${lotMkt==="all"?"on":""}" data-mk="all">전체 시장</button>
    <button class="chip mode ${lotMkt==="서울"?"on":""}" data-mk="서울">서울청과</button>
    <button class="chip mode ${lotMkt==="동화"?"on":""}" data-mk="동화">동화청과</button>`;
  renderFeed();
  const kw=query.trim().toLowerCase();
  const rows=all.filter(l=>{
    if(lotMkt!=="all" && !String(l.mkt||"").startsWith(lotMkt)) return false;
    if(filter==="todo"&&isDone(l)) return false;
    if(filter==="done"&&!isDone(l)) return false;
    if(filter==="pick"&&!isPick(l)) return false;
    if(filter==="re"&&!isReauc(l)) return false;
    if(!kw) return true;
    return [l.item,normItem(l.item),l.who,l.no,l.grade,l.mkt].filter(Boolean).join(" ").toLowerCase().includes(kw);
  });
  const list=document.getElementById("lotlist");
  if(!rows.length){
    list.innerHTML=(!(lotDate in calDayCache)&&!all.length)
      ? `<div class="caldempty">불러오는 중…</div>`
      : all.length?emptyHTML():`<div class="empty">${dateKo(lotDate)}에는 낙찰 기록이 없습니다.<br>위의 날짜를 눌러 다른 날짜를 골라 보세요.</div>`;
    bindEmpty(); return;
  }
  const groups=invGroups(rows);
  const buy=rows.filter(l=>!isReauc(l));     // 재경매 줄은 합계에서 뺀다
  const tq=buy.reduce((a,l)=>a+(Number(l.qty)||0),0), ta=buy.reduce((a,l)=>a+lotAmt(l),0);
  list.innerHTML=groups.map(g=>{
    const gg=g.rows.filter(isDone).reduce((a,l)=>a+l.qty,0);
    return `<div class="invgrp">
    <div class="invgh"><b>${esc(g.title)}</b><span class="tnum">${g.rows.length}줄 · 수량 ${g.qty} · ${won(g.amt)}원${
      g.rows.some(l=>l._live)?` · 챙김 ${gg}/${g.qty}`:""}${g.re?` · 재경매 ${g.re}줄 제외`:""}</span></div>
    <div class="xwrap"><table class="xl"><thead><tr>
      <th></th><th>번호</th><th class="xw">생산자</th><th>단량<br>등급</th><th>수량</th><th>경락단가 ▲<br>거래금액</th><th></th><th class="pkh">우선<br>픽업</th>
    </tr></thead><tbody>${g.rows.map(lotRow).join("")}</tbody>
    <tfoot><tr><td></td><td class="c">소계</td><td></td><td></td><td class="r">${g.qty}</td><td class="r">${won(g.amt)}</td><td></td><td></td></tr></tfoot>
    </table></div></div>`;}).join("")
    +`<div class="grand"><span>합계 ${buy.length}줄${rows.length>buy.length?`<small>재경매 ${rows.length-buy.length}줄 제외</small>`:""}</span><span>수량 ${tq}</span><span>${won(ta)}원</span></div>`;
}

let dp={y:0,m:0,d:0};
const dimOf=(y,m)=>new Date(Date.UTC(y,m,0)).getUTCDate();
function dpStr(){ return `${dp.y}-${String(dp.m).padStart(2,"0")}-${String(dp.d).padStart(2,"0")}`; }

  /* 달력처럼 넘어간다: 1일에서 − 를 누르면 전달 말일, 12월에서 + 를 누르면 다음 해 1월 */
  if(k==="y") dp.y+=step;
  if(k==="m"){ dp.m+=step; if(dp.m>12){dp.m=1;dp.y++;} if(dp.m<1){dp.m=12;dp.y--;} }
  if(k==="m"||k==="y") dp.d=Math.min(dp.d,dimOf(dp.y,dp.m));
  if(k==="d"){
    const t=new Date(Date.UTC(dp.y,dp.m-1,dp.d+step));
    dp={y:t.getUTCFullYear(),m:t.getUTCMonth()+1,d:t.getUTCDate()};
  }
  dpShow();
});

/* ==================== 재고 관리 탭 (예전 이름: 품목 관리) ====================
   서울청과·동화청과 구분 없이 품목별로 묶고, 그 안에서 낙찰 단가가 싼 것부터 늘어놓는다
   (단가가 같으면 소요금액이 작은 줄 먼저). 각 줄의 잔여 수량을 고칠 수 있고,
   '전량 출고'를 누르면 목록에서 빠져 출고 기록으로 옮겨진다(서버 state.shipped).
   출고 기록은 크기가 커질 수 있어 실시간 자료에 안 실려 오므로 /api/shipped 로 따로 받는다. */
let invMode="stock", invPeriod="month", shippedRows=null, invImportOpen=false;

/* 시장마다 품목 이름 쓰는 법이 달라서 하나로 맞춘다.
   동화청과 '고추(꽈리)' → '꽈리고추', '파프리카(노랑)' → '노랑파프리카' */
const ITEM_ALIAS={"홍청양고추":"홍청양","아삭이고추":"오이맛고추","녹광":"녹광고추","빨강파프리카":"홍파프리카"};   // 시장마다 다른 이름을 하나로
function normItem(t){
  let s=String(t||"").replace(/\s+/g,"");
  const m=s.match(/^(.+)\((.+)\)$/);
  if(m) s=m[2]+m[1];
  return ITEM_ALIAS[s]||s||"품목 미상";
}
const lotAmt=l=>(Number(l.price)||0)*(Number(l.qty)||0);
const mktShort=m=>String(m||"").replace("청과","");
const mmdd=d=>String(d||"").slice(5);
const unitTxt=u=>{const n=parseFloat(u); return isNaN(n)?String(u||""):n+"kg";};
const INV_CATS=["고추","파프리카·피망","버섯","기타"];

/* 품목별 묶음 — 품목은 큰 갈래(고추 → 파프리카·피망 → …) 다음 이름 순 */
function invGroups(rows){
  const by={};
  rows.forEach(l=>{ const k=normItem(l.item); (by[k]=by[k]||[]).push(l); });
  return Object.keys(by)
    .sort((a,b)=>(INV_CATS.indexOf(catOf(a))-INV_CATS.indexOf(catOf(b)))||a.localeCompare(b,"ko"))
    .map(k=>({ title:k,
      rows:by[k].slice().sort((a,b)=>(a.price-b.price)||(lotAmt(a)-lotAmt(b))||(a.who||"").localeCompare(b.who||"","ko")),
      /* 재경매로 분류한 줄은 실제로 산 게 아니므로 수량·금액 합에서 뺀다 */
      qty:by[k].filter(l=>!isReauc(l)).reduce((a,l)=>a+(Number(l.qty)||0),0),
      left:by[k].filter(l=>!isReauc(l)).reduce((a,l)=>a+(Number(l.left)||0),0),
      amt:by[k].filter(l=>!isReauc(l)).reduce((a,l)=>a+lotAmt(l),0),
      re:by[k].filter(isReauc).length }));
}
function invMatch(l){
  const kw=query.trim().toLowerCase();
  if(!kw) return true;
  return [l.item,normItem(l.item),l.who,l.no,l.grade,l.mkt].filter(Boolean).join(" ").toLowerCase().includes(kw);
}
async function loadShipped(){
  if(!serverUrl){ shippedRows=[]; return; }
  try{ const r=await fetch(serverUrl+"/api/shipped"); const j=await r.json(); shippedRows=(j&&j.rows)||[]; }
  catch(e){ shippedRows=shippedRows||[]; }
}
function shipDay(l){ return new Date((l.shippedAt||0)+9*3600e3).toISOString().slice(0,10); }
function inPeriod(l){
  const d=shipDay(l), t=오늘KST();
  if(invPeriod==="month") return d.slice(0,7)===t.slice(0,7);
  if(invPeriod==="prev"){
    const y=+t.slice(0,4), m=+t.slice(5,7), pm=m===1?`${y-1}-12`:`${y}-${String(m-1).padStart(2,"0")}`;
    return d.slice(0,7)===pm;
  }
  return true;
}

function renderInv(){
  /* 재고 관리에는 지난 경매일 낙찰만 보인다. 오늘 경매일 낙찰은 낙찰 내역에서 챙기고,
     하루가 지나면(한국 시간 15시에 경매일이 바뀌면) 서버가 자동으로 넘겨준다. */
  const curDay=경매일KST();
  const allInv=Object.values(state.inv||{});
  const inv=allInv.filter(l=>!l.date||l.date<curDay);
  const waiting=allInv.length-inv.length;
  const shipped=shippedRows||[];
  const chips=document.getElementById("chips");
  chips.innerHTML=`
    <button class="chip ${invMode==="fifo"?"on":""}" data-im="fifo">📋 선입선출 준비</button>
    <button class="chip ${invMode==="stock"?"on":""}" data-im="stock">재고 ${inv.length}</button>
    <button class="chip ${invMode==="shipped"?"on":""}" data-im="shipped">출고 기록${shippedRows?" "+shipped.length:""}</button>
    ${invMode==="shipped"?`<span class="div"></span>
    <button class="chip mode ${invPeriod==="month"?"on":""}" data-ip="month">이번 달</button>
    <button class="chip mode ${invPeriod==="prev"?"on":""}" data-ip="prev">지난 달</button>
    <button class="chip mode ${invPeriod==="all"?"on":""}" data-ip="all">전체</button>`:""}`;
  const box=document.getElementById("invbody");

  if(invMode==="fifo"){
    /* 칸에 적는 중이면 다시 그리지 않는다 (다른 사람이 바꿀 때마다 쓰던 글자가 날아가지 않게) */
    const a=document.activeElement;
    if(a&&a.tagName==="INPUT"&&box.contains(a)) return;
    return renderFifo(box,curDay,inv);
  }

  if(invMode==="shipped"){
    if(shippedRows===null){ box.innerHTML=`<div class="caldempty">불러오는 중…</div>`; return; }
    const rows=shipped.filter(inPeriod).filter(invMatch);
    const total=rows.reduce((a,l)=>a+lotAmt(l),0), qty=rows.reduce((a,l)=>a+(Number(l.qty)||0),0);
    const label={month:"이번 달",prev:"지난 달",all:"전체"}[invPeriod];
    const groups=invGroups(rows);
    box.innerHTML=`<div class="invsum">
        <div><small>${label} 출고 소요금액</small><b class="tnum">${won(total)}원</b></div>
        <div><small>출고 줄 수</small><b class="tnum">${rows.length}줄</b></div>
        <div><small>출고 수량</small><b class="tnum">${won(qty)}</b></div></div>
      <div class="invtools"><button data-iact="csv">📥 엑셀로 내려받기</button></div>
      ${groups.length?groups.map(g=>`<div class="invgrp">
        <div class="invgh"><b>${esc(g.title)}</b><span class="tnum">${g.rows.length}줄 · 수량 ${g.qty} · 소요 ${won(g.amt)}원</span></div>
        <div class="xwrap"><table class="xl"><thead><tr>
          <th class="xw">생산자</th><th>출고일</th><th>규격</th><th>수량</th><th>단가<br>소요금액</th><th></th>
        </tr></thead><tbody>${g.rows.map(l=>`<tr data-id="${esc(l.id)}" class="${mkCls(l)}">
          <td class="xw">${esc(l.who||"-")}<span class="sm">${esc(mktShort(l.mkt))} · ${esc(mmdd(l.date))} 경매</span></td>
          <td class="c">${esc(mmdd(shipDay(l)))}<span class="sm">${esc(l.shippedBy||"")}</span></td>
          <td class="c">${esc(unitTxt(l.unit))}<span class="sm">${esc(l.grade||"")}</span></td>
          <td class="r">${l.qty}</td><td class="r"><b class="price">${won(l.price)}</b><span class="sm">${won(lotAmt(l))}</span></td>
          <td class="c"><button class="unshipbtn" data-iact="unship">되돌리기</button></td></tr>`).join("")}
        </tbody><tfoot><tr><td class="xw">소계</td><td></td><td></td>
          <td class="r">${g.qty}</td><td class="r">${won(g.amt)}</td><td></td></tr></tfoot></table></div></div>`).join("")
        :`<div class="caldempty">${label} 출고 기록이 없습니다.</div>`}`;
    return;
  }

  const rows=inv.filter(invMatch);
  const groups=invGroups(rows);
  const invBuy=inv.filter(l=>!isReauc(l));     // 재경매 줄은 산 게 아니므로 합계에서 뺀다
  const total=invBuy.reduce((a,l)=>a+lotAmt(l),0);
  const leftAmt=invBuy.reduce((a,l)=>a+(Number(l.price)||0)*(Number(l.left)||0),0);
  const leftQty=invBuy.reduce((a,l)=>a+(Number(l.left)||0),0);
  const d5=new Date(Date.now()+9*3600e3-4*86400e3).toISOString().slice(0,10);
  box.innerHTML=`${waiting?`<p class="hint">오늘 경매(${mmdd(curDay)}) 낙찰 ${waiting}줄은 낙찰 내역에서 챙기고, 하루가 지나면(오후 3시) 자동으로 여기로 넘어옵니다.</p>`:""}<div class="invsum">
      <div><small>재고 낙찰 소요금액</small><b class="tnum">${won(total)}원</b></div>
      <div><small>남은 물건 금액</small><b class="tnum">${won(leftAmt)}원</b></div>
      <div><small>남은 수량</small><b class="tnum">${won(leftQty)}</b></div></div>
    <div class="invtools">
      <button data-iact="csv">📥 엑셀로 내려받기</button>
      <button data-iact="importtoggle">📅 지난 낙찰 불러오기 ${invImportOpen?"▾":"▸"}</button></div>
    ${invImportOpen?`<p class="hint">캘린더에 쌓인 낙찰 기록 중 고른 기간의 줄을 재고 관리 목록에 올립니다.
      이미 목록에 있거나 전량 출고한 줄은 다시 올리지 않습니다.</p>
      <div class="importbox"><div><label class="fl">부터</label><input type="text" id="imp_from" value="${d5}"></div>
        <div><label class="fl">까지</label><input type="text" id="imp_to" value="${경매일KST()}"></div>
        <button data-iact="import">불러오기</button></div>`:""}
    ${groups.length?groups.map(g=>`<div class="invgrp">
      <div class="invgh"><b>${esc(g.title)}</b><span class="tnum">${g.rows.length}줄 · 잔여 ${g.left}/${g.qty} · 소요 ${won(g.amt)}원</span></div>
      <div class="xwrap"><table class="xl inv"><thead><tr>
        <th class="ck" title="체크하면 고정 — 풀기 전엔 수정·출고·삭제 안 됨">🔒</th><th class="xw">생산자</th><th>규격</th><th>수량</th><th>단가 ▲<br>소요금액</th><th>잔여 수량</th><th>출고</th>
      </tr></thead><tbody>${g.rows.map(l=>`<tr data-id="${esc(l.id)}" class="${[l.left>0?"":"zero",mkCls(l),isReauc(l)?"reauc":"",l.lock?"locked":""].join(" ")}">
        <td class="ck"><button class="ckb" data-iact="lock" aria-label="${l.lock?"고정 풀기":"고정"}" title="${l.lock?esc((l.lock.by||"")+" 고정 · 탭하면 풀기"):"탭하면 고정"}"><i>✓</i></button></td>
        <td class="xw">${esc(l.who||"-")}<span class="sm">${esc(mktShort(l.mkt))} · ${esc(mmdd(l.date))}</span></td>
        <td class="c">${esc(unitTxt(l.unit))}<span class="sm">${esc(l.grade||"")}</span></td>
        <td class="r">${l.qty}</td><td class="r"><b class="price">${won(l.price)}</b><span class="sm">${won(lotAmt(l))}</span></td>
        <td><div class="left"><button data-iact="dec" aria-label="하나 빼기"${l.lock?" disabled":""}>−</button>
          <button class="lv tnum" data-iact="setleft"${l.lock?" disabled":""}>${l.left}<small>/${l.qty}</small></button>
          <button data-iact="inc" aria-label="하나 더하기"${l.lock?" disabled":""}>+</button></div></td>
        <td class="c"><button class="shipbtn" data-iact="ship"${l.lock?" disabled":""}>${l.lock?"고정":"전량<br>출고"}</button></td></tr>`).join("")}
      </tbody><tfoot><tr><td></td><td class="xw">소계</td><td></td>
        <td class="r">${g.qty}</td><td class="r">${won(g.amt)}</td><td class="c">${g.left}</td><td></td></tr></tfoot></table></div></div>`).join("")
      :`<div class="empty">재고 관리 목록이 비어 있습니다.<br>낙찰은 하루가 지나면 자동으로 넘어오고,
        위의 '지난 낙찰 불러오기'로 캘린더 기록에서 가져올 수도 있습니다.</div>`}`;
}

/* 엑셀에서 바로 열리는 CSV(UTF-8 BOM)로 내려받는다 — 지금 화면에 보이는 목록 그대로 */
/* ==================== 선입선출 준비표 (재고 관리 → 📋 선입선출 준비) ====================
   지금까지 낙찰받은 모든 품목(최근 40일 기록 + 재고 + 출고 기록)을 한 장에 모아, 매일 경매 전에
   ① 품목마다 남은 재고를 '오래된 것부터' 순서대로 보여주고(먼저 내보낼 것), ② 최근 경매 7회 평균
   낙찰 수량과 비교해 오늘 몇 박스를 받을지 목표·메모를 적고, ③ 준비가 끝난 품목을 ✓ 로 표시한다.
   목표·메모·확인은 경매일별로 서버에 남아 다섯 명이 같이 본다(fifo op, state.fifo[경매일][품목]). */
let itemStats=null, itemStatsAt=0;
async function loadItemStats(force){
  if(!serverUrl){ itemStats=[]; return; }
  if(!force&&itemStats&&Date.now()-itemStatsAt<600e3) return;
  try{ const j=await (await fetch(serverUrl+"/api/itemstats")).json(); itemStats=j.rows||[]; itemStatsAt=Date.now(); }
  catch(e){ itemStats=itemStats||[]; }
}
const OLD_DAYS=3;                                   // 이만큼 지난 재고는 빨간색 '오래됨'
const dayDiff=(a,b)=>Math.round((Date.parse(a+"T00:00:00Z")-Date.parse(b+"T00:00:00Z"))/86400e3);
function fifoData(curDay,inv){
  const stats=itemStats||[];
  /* 최근 경매 7회 = 기록에 낙찰이 있는 날짜 중 오늘 경매일 전의 마지막 7개 */
  const dates=[...new Set(stats.map(r=>r.date))].filter(d=>d<curDay).sort().slice(-7);
  const items={};
  const get=k=>items[k]=items[k]||{name:k,lots:[],sum7:0,last:null,total:0};
  stats.forEach(r=>{ const it=get(normItem(r.item)); it.total+=r.qty;
    if(dates.includes(r.date)) it.sum7+=r.qty; if(!it.last||r.date>it.last) it.last=r.date; });
  (shippedRows||[]).forEach(l=>get(normItem(l.item)));
  inv.filter(l=>!isReauc(l)&&(Number(l.left)||0)>0).forEach(l=>get(normItem(l.item)).lots.push(l));
  const list=Object.values(items).map(it=>{
    it.lots.sort((a,b)=>(a.date||"").localeCompare(b.date||"")||String(a.no||"").localeCompare(String(b.no||"")));
    it.stock=it.lots.reduce((a,l)=>a+(Number(l.left)||0),0);
    it.avg=dates.length?Math.round(it.sum7/dates.length):0;
    it.oldest=it.lots.length?it.lots[0].date:null;
    it.age=it.oldest?dayDiff(curDay,it.oldest):null;
    it.suggest=Math.max(0,it.avg-it.stock);          // 참고: 평소 받는 양 − 남은 재고
    return it;
  });
  /* 재고가 있는 품목(오래된 것 먼저) → 재고 없는 품목(평소 많이 받는 것 먼저) */
  list.sort((a,b)=>(b.stock>0)-(a.stock>0)||(b.age??-1)-(a.age??-1)||b.avg-a.avg||a.name.localeCompare(b.name,"ko"));
  return {list,dates};
}
/* 경매 전 준비 양식 — 품목·규격 한 줄씩, 거래처별 수량 칸.
   세계로(수량 box · 봉지 대 · 봉지 소) / 일일향 / 초록. 경매일별로 서버에 저장(prep op, state.prep). */
const PREP_ROWS=[
  ["빨강 파프리카",["XL","L","M"]],["노랑 파프리카",["XL","L","M"]],
  ["피망",["특(L)","상(M)"]],["홍피망",["특(L)","상(M)"]],["청양",["특(L)","상(M)"]],["홍청양",["특(L)","상(M)"]],
  ["꽈리",["특(L)","상(M)"]],["홍고추(홍초)",["특(L)","상(M)"]],["롱그린",["특","상"]],["아삭이벌크",["특","상"]],
  ["아삭이팩",[""]]
].flatMap(([item,gs])=>gs.map(g=>({key:item+"|"+g,label:item+(g?" "+g:"")})));
const PREP_COLS=["box","bagL","bagS","ilil","chorok"];
/* 저장을 누르면(prepsave op → state.prep[경매일]._saved) 수량을 적은 줄만 남기고, 아래 품목별 재고 카드도
   챙길 품목(준비 양식에 수량이 있는 품목 · 목표/메모를 적은 품목)만 보여준다. '다시 고치기'로 전체 양식에 돌아간다. */
const prepHas=v=>PREP_COLS.some(c=>(Number((v||{})[c])||0)>0);
const prepSaved=curDay=>!!(((state.prep||{})[curDay]||{})._saved);
/* 준비 양식 품목 이름 → 재고 카드 품목 이름(normItem)과 맞춰 보기: '빨강 파프리카'→'홍파프리카', '꽈리'→'꽈리고추' */
const prepBase=item=>normItem(String(item).replace(/\(.*\)/,""));
function prepItems(curDay){
  const day=(state.prep||{})[curDay]||{};
  return [...new Set(PREP_ROWS.filter(r=>prepHas(day[r.key])).map(r=>prepBase(r.key.split("|")[0])))];
}
const matchPrep=(name,bases)=>bases.some(b=>name.startsWith(b)||b.startsWith(name));
function prepTable(curDay){
  const day=(state.prep||{})[curDay]||{};
  const saved=prepSaved(curDay);
  const rows=saved?PREP_ROWS.filter(r=>prepHas(day[r.key])):PREP_ROWS;
  const sum=c=>PREP_ROWS.reduce((a,r)=>a+(Number((day[r.key]||{})[c])||0),0);
  return `<div class="xwrap"><table class="xl prep${saved?" saved":""}"><thead>
      <tr><th rowspan="2" class="pitem">품목</th><th colspan="3" class="pseg">세계로</th><th rowspan="2">일일향</th><th rowspan="2">초록</th></tr>
      <tr><th>수량<br>(box)</th><th>봉지<br>(대)</th><th>봉지<br>(소)</th></tr></thead><tbody>
    ${rows.map(r=>{ const v=day[r.key]||{};
      return `<tr data-prow="${esc(r.key)}"><td class="pitem">${esc(r.label)}</td>${PREP_COLS.map(c=>
        `<td class="pc${c==="bagS"?" pseg-end":""}">${saved?`<b class="tnum">${v[c]||""}</b>`
          :`<input type="number" inputmode="numeric" min="0" data-pc="${c}" value="${v[c]??""}">`}</td>`).join("")}</tr>`; }).join("")}
    </tbody><tfoot><tr><td class="pitem">합계</td>${PREP_COLS.map(c=>`<td class="r">${sum(c)||""}</td>`).join("")}</tr></tfoot></table></div>`;
}

function renderFifo(box,curDay,inv){
  if(itemStats===null){ box.innerHTML=`<div class="caldempty">불러오는 중…</div>`; loadItemStats().then(()=>{ if(tab==="inv") render(); }); return; }
  const {list,dates}=fifoData(curDay,inv);
  const kw=query.trim().toLowerCase();
  const sheet=(state.fifo||{})[curDay]||{};
  const saved=prepSaved(curDay), sv=((state.prep||{})[curDay]||{})._saved||{};
  const bases=prepItems(curDay);
  const need=it=>{ const f=sheet[it.name]||{}; return (Number(f.plan)||0)>0||!!f.memo||matchPrep(it.name,bases); };
  const shown=list.filter(it=>(!kw||it.name.toLowerCase().includes(kw))&&(!saved||need(it)));
  const oldLots=list.reduce((a,it)=>a+it.lots.filter(l=>dayDiff(curDay,l.date)>=OLD_DAYS).length,0);
  const doneN=list.filter(it=>(sheet[it.name]||{}).done).length;
  box.innerHTML=`<div class="ffhead0"><b>경매 전 준비 양식</b><span>경매일 ${mmdd(curDay)}</span></div>
    ${saved?`<p class="hint savedhint">💾 저장됨 — 챙길 품목만 남겼습니다 (${esc(sv.by||"")} · ${ago(sv.at)}). 고치려면 '다시 고치기'를 누르세요.</p>`
      :`<p class="hint">칸에 수량을 적으면 바로 다섯 명이 같이 봅니다. 다 적고 <b>저장</b>을 누르면 수량을 적은 품목만 남습니다. 경매일이 바뀌면(오후 3시) 새 양식이 됩니다.</p>`}
    ${prepTable(curDay)}
    <div class="invtools">${saved?`<button data-iact="prepedit">✏️ 다시 고치기 (전체 양식)</button>`
      :`<button class="savebtn" data-iact="prepsave">💾 저장 — 챙길 품목만 남기기</button>`}
      <button data-iact="csv">📥 엑셀로 내려받기</button></div>
    <div class="ffhead0" style="margin-top:18px"><b>선입선출 — ${saved?"챙길 품목 재고":"품목별 재고"}</b><span>품목 ${saved?shown.length+"/":""}${list.length}개</span></div>
    <div class="invsum">
      <div><small>재고 있는 품목</small><b class="tnum">${list.filter(i=>i.stock>0).length}개</b></div>
      <div><small>${OLD_DAYS}일 넘은 재고</small><b class="tnum" style="${oldLots?"color:#C0392B":""}">${oldLots}줄</b></div>
      <div><small>준비 확인</small><b class="tnum">${doneN}/${list.length}</b></div></div>
    <p class="hint">품목마다 남은 재고를 <b>오래된 것부터</b> 적었습니다 — 위에서부터 먼저 내보내세요.
      '7회 평균'은 최근 경매 ${dates.length}번의 하루 평균 낙찰 수량이고, '권장'은 평균에서 남은 재고를 뺀 참고값입니다.</p>
    ${shown.length?shown.map(it=>{
      const f=sheet[it.name]||{};
      return `<div class="ffcard ${f.done?"ffdone":""}" data-item="${esc(it.name)}">
        <div class="ffh"><b>${esc(it.name)}</b>
          <button class="ffok" data-iact="ffdone">${f.done?"✓ 준비됨":"준비 확인"}</button></div>
        <div class="ffs tnum">재고 <b>${it.stock}</b>박스${it.oldest?` · 가장 오래된 ${mmdd(it.oldest)} <span class="${it.age>=OLD_DAYS?"ffold":""}">(${it.age}일)</span>`:""}
          · 7회 평균 <b>${it.avg}</b>${it.last?` · 마지막 낙찰 ${mmdd(it.last)}`:""}</div>
        ${it.lots.length?`<div class="xwrap"><table class="xl ff"><thead><tr>
            <th>순서</th><th>경매일</th><th class="xw">생산자</th><th>규격</th><th>잔여</th></tr></thead><tbody>
          ${it.lots.map((l,i)=>{ const age=dayDiff(curDay,l.date);
            return `<tr class="${mkCls(l)}"><td class="c"><b>${i===0?"먼저":i+1}</b></td>
              <td class="c">${esc(mmdd(l.date))}<span class="sm ${age>=OLD_DAYS?"ffold":""}">${age}일${age>=OLD_DAYS?" 오래됨":""}</span></td>
              <td class="xw">${esc(l.who||"-")}<span class="sm">${esc(mktShort(l.mkt))}</span></td>
              <td class="c">${esc(unitTxt(l.unit))}<span class="sm">${esc(l.grade||"")}</span></td>

function invCSV(){
  if(invMode==="fifo"){                               // 선입선출 준비표를 그대로 엑셀로
    const curDay=경매일KST(), sheet=(state.fifo||{})[curDay]||{};
    const {list}=fifoData(curDay,Object.values(state.inv||{}).filter(l=>!l.date||l.date<curDay));
    const day=(state.prep||{})[curDay]||{};
    const lines=[[`경매 전 준비 양식 (경매일 ${curDay})`],["품목","세계로","","","일일향","초록"],["","수량(box)","봉지(대)","봉지(소)","",""]];
    PREP_ROWS.forEach(r=>{ const v=day[r.key]||{}; lines.push([r.label,...PREP_COLS.map(c=>v[c]??"")]); });
    lines.push(["합계",...PREP_COLS.map(c=>PREP_ROWS.reduce((a,r)=>a+(Number((day[r.key]||{})[c])||0),0))]);
    lines.push([],["선입선출 — 품목별 재고 (오래된 것부터)"]);
    lines.push(["품목","출고순서","경매일","경과일","시장","생산자","단위","등급","잔여","총재고","7회평균","오늘목표","메모","준비확인"]);
    list.forEach(it=>{ const f=sheet[it.name]||{};
      const tail=[it.stock,it.avg,f.plan??"",f.memo||"",f.done?"✓":""];
      if(!it.lots.length) lines.push([it.name,"","","","","","","","",...tail]);
      it.lots.forEach((l,i)=>lines.push([it.name,i+1,l.date,dayDiff(curDay,l.date),l.mkt,l.who,l.unit,l.grade,l.left,...tail])); });
    const csv="\ufeff"+lines.map(r=>r.map(v=>{const t=String(v??"");return /[",\n]/.test(t)?`"${t.replace(/"/g,'""')}"`:t;}).join(",")).join("\r\n");
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
    a.download=`선입선출준비_${curDay}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    return;
  }
  const shippedView=invMode==="shipped";
  const rows=shippedView?(shippedRows||[]).filter(inPeriod).filter(invMatch)
    :Object.values(state.inv||{}).filter(l=>!l.date||l.date<경매일KST()).filter(invMatch);
  const head=shippedView
    ?["품목","생산자","시장","경매일","번호","단위","등급","수량","단가","소요금액","출고일","출고자"]
    :["품목","생산자","시장","경매일","번호","단위","등급","수량","단가","소요금액","잔여수량"];
  const lines=[head];
  invGroups(rows).forEach(g=>g.rows.forEach(l=>{
    const base=[g.title,l.who,l.mkt,l.date,l.no,l.unit,l.grade,l.qty,l.price,lotAmt(l)];
    lines.push(shippedView?base.concat([shipDay(l),l.shippedBy||""]):base.concat([l.left]));
  }));
  const csv="\ufeff"+lines.map(r=>r.map(v=>{const t=String(v??"");return /[",\n]/.test(t)?`"${t.replace(/"/g,'""')}"`:t;}).join(",")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=`${shippedView?"출고기록":"재고관리"}_${오늘KST()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

const invStat=t=>{const el=document.getElementById("invstat"); if(el)el.textContent=t||"";};
document.getElementById("invview").addEventListener("click",e=>{
  const b=e.target.closest("[data-iact]"); if(!b)return;
  const act=b.dataset.iact;
  if(act==="csv") return invCSV();
  if(act==="ffdone"){
    const item=b.closest("[data-item]").dataset.item, cur=(((state.fifo||{})[경매일KST()]||{})[item]||{}).done;
    pushOp({t:"fifo",date:경매일KST(),item,done:!cur}); return;
  }
  if(act==="prepsave"||act==="prepedit"){
    const d=경매일KST();
    if(act==="prepsave"){                             // 방금 적고 칸을 벗어나지 않은 값까지 빠짐없이 먼저 올린다
      document.querySelectorAll("#invbody [data-pc]").forEach(inp=>{
        const row=inp.closest("[data-prow]").dataset.prow, c=inp.dataset.pc;
        const cur=((((state.prep||{})[d]||{})[row])||{})[c];
        const v=inp.value===""?null:Math.max(0,Math.round(Number(inp.value)||0));
        if((cur??null)!==v) pushOp({t:"prep",date:d,row,col:c,value:inp.value});
      });
      document.querySelectorAll("#invbody [data-ff]").forEach(inp=>{
        const item=inp.closest("[data-item]").dataset.item, k=inp.dataset.ff;
        const cur=((((state.fifo||{})[d]||{})[item])||{})[k];
        if(String(cur??"")!==inp.value) pushOp({t:"fifo",date:d,item,[k]:inp.value});
      });
    }
    if(act==="prepsave"&&!PREP_ROWS.some(r=>prepHas(((state.prep||{})[d]||{})[r.key]))&&!Object.values((state.fifo||{})[d]||{}).some(f=>(Number(f.plan)||0)>0||f.memo)){
      alert("아직 적은 수량이 없습니다. 챙길 품목의 수량을 적은 뒤 저장해 주세요."); return; }
    pushOp({t:"prepsave",date:d,on:act==="prepsave"});
    invStat(act==="prepsave"?"저장했습니다 — 챙길 품목만 남겼습니다.":"전체 양식으로 돌아왔습니다.");
    return;
  }
  if(act==="importtoggle"){ invImportOpen=!invImportOpen; return render(); }
  if(act==="import"){
    const from=document.getElementById("imp_from").value.trim(), to=document.getElementById("imp_to").value.trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(from)||!/^\d{4}-\d{2}-\d{2}$/.test(to)){ alert("날짜를 2026-10-01 처럼 적어 주세요."); return; }
    if(!serverUrl){ alert("서버에 연결되어 있어야 불러올 수 있습니다."); return; }
    invImportOpen=false; pushOp({t:"invimport",from,to});
    invStat(`${from} ~ ${to} 낙찰 기록을 불러왔습니다.`);
    return;
  }
  const tr=b.closest("tr[data-id]"); if(!tr)return;
  const id=tr.dataset.id;
  if(act==="unship"){
    const l=(shippedRows||[]).find(x=>x.id===id); if(!l)return;
    if(!confirm(`'${normItem(l.item)} · ${l.who||""}' 출고를 되돌려 재고 목록으로 다시 올립니다.`)) return;
    pushOp({t:"unship",id});
    shippedRows=(shippedRows||[]).filter(x=>x.id!==id);
    return render();
  }
  const l=(state.inv||{})[id]; if(!l)return;
  if(act==="lock"){                                   // 체크 = 고정. 다시 탭해야 풀린다
    pushOp({t:"invlock",id,on:!l.lock});
    invStat(l.lock?`'${normItem(l.item)} · ${l.who||""}' 고정을 풀었습니다.`:`'${normItem(l.item)} · ${l.who||""}' 고정 — 체크를 풀기 전엔 수정·출고·삭제가 안 됩니다.`);
    return;
  }
  if(l.lock){ invStat("고정(체크)한 줄입니다. 맨 왼쪽 체크를 풀어야 고칠 수 있습니다."); return; }
  if(act==="dec"||act==="inc"){
    const n=Math.max(0,Math.min(l.qty,(l.left||0)+(act==="inc"?1:-1)));
    if(n!==l.left) pushOp({t:"invleft",id,left:n});
  } else if(act==="setleft"){
    const v=prompt(`${normItem(l.item)} · ${l.who||""}\n잔여 수량 (0~${l.qty})`,l.left);
    if(v===null) return;
    const n=Number(v);
    if(!Number.isFinite(n)||n<0||n>l.qty){ alert(`0부터 ${l.qty} 사이로 적어 주세요.`); return; }
    pushOp({t:"invleft",id,left:Math.round(n)});
  } else if(act==="ship"){
    const 이름=`${normItem(l.item)} · ${l.who||""}`;
    if(!confirm(`'${이름}' (${l.qty}개 · ${won(lotAmt(l))}원)\n전량 출고 처리합니다.\n목록에서 빠지고 출고 기록으로 옮겨집니다.`)) return;
    if(shippedRows) shippedRows=shippedRows.concat([Object.assign({},l,{left:0,shippedAt:Date.now(),shippedBy:me||"나"})]);
    pushOp({t:"ship",id});
    invStat(`'${이름}' 전량 출고 — 출고 기록으로 옮겼습니다.`);
  }
});

/* 낙찰 줄을 세 번 연속(0.9초 안) 탭하면 재경매 ↔ 일반 낙찰을 바꾼다. 체크·주석·우선 픽업 버튼을
   누른 탭은 세지 않는다. 화면이 실시간으로 다시 그려져도 줄 id 로 세므로 끊기지 않는다. */
const tapLog={};
function countTap(id){
  const now=Date.now(), a=(tapLog[id]||[]).filter(t=>now-t<900);
  a.push(now); tapLog[id]=a;
  if(a.length<3) return false;
  tapLog[id]=[]; return true;
}
document.querySelector("main").addEventListener("click",e=>{
  const btn=e.target.closest("[data-act]");
  const tapRow=!btn&&e.target.closest("tr[data-tap='re']");
  if(tapRow){
    const id=tapRow.dataset.id;
    if(countTap(id)){
      const on=!(state.reauc||{})[id];
      pushOp({t:"reauc",id,on});
      const st=document.getElementById("lotstat");
      if(st) st.textContent=on?"재경매로 분류했습니다 (세 번 다시 탭하면 일반 낙찰로 돌아갑니다)":"일반 낙찰로 되돌렸습니다";
    }
    return;
  }
  if(btn){
    const act=btn.dataset.act;
    if(act==="fold"){const k=btn.dataset.k||btn.closest("section").dataset.g;collapsed[k]=!collapsed[k];return render();}
    const card=btn.closest(".card,tr[data-id]"); if(!card)return;
    const id=card.dataset.id;
    if(act==="toggle"){
      const done=!state.done[id];
      const st=STOPS.find(x=>x.id===id);
      pushOp({t:"car",id,done,name:st?st.name:id});
    }
    else if(act==="note"){ openNote=openNote===id?null:id; render();
      const ta=document.getElementById("ta-"+id); if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);} }
    else if(act==="ncancel"){ openNote=null; render(); }
    else if(act==="nsave"){ const v=document.getElementById("ta-"+id).value.trim();
      const st=STOPS.find(x=>x.id===id);
      openNote=null; pushOp({t:"note",id,text:v,name:st?st.name:id}); }
    else if(act==="pickup"){
      pushOp({t:"pickup",id,on:!(state.pickup||{})[id]});
    }
    else if(act==="lottoggle"){
      const l=state.lots.find(x=>x.id===id); if(!l)return;
      const g=(state.got[id]||0)>=l.qty ? 0 : l.qty;
      openLotNote=null;
      pushOp({t:"got",id,n:g});
    }
    else if(act==="lotnote"){
      openLotNote=openLotNote===id?null:id; render();
      const ta=document.getElementById("lta-"+id);   // id 에 | 가 들어가도 getElementById 는 괜찮다
      if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}
    }
    else if(act==="lncancel"){ openLotNote=null; render(); }
    else if(act==="lnsave"){
      const v=document.getElementById("lta-"+id).value.trim();
      openLotNote=null; pushOp({t:"lotnote",id,text:v});
    }
    else if(act==="lotdel"){
      /* 잘못 읽힌 줄을 하나만 지운다. 모두에게서 사라지므로 한 번 더 묻는다. */
      const l=(state.lots||[]).find(x=>x.id===id);
      const 이름=l?[l.item,l.who].filter(Boolean).join(" · "):"이 줄";
      if(((state.inv||{})[id]||{}).lock){ alert(`'${이름}' 은(는) 재고 관리에서 고정(체크)한 줄이라 지울 수 없습니다.`); return; }
      if(!confirm(`'${이름}' 줄을 지웁니다.
모두의 화면에서 사라지고, 세어둔 박스 수도 함께 지워집니다.`)) return;
      openLotNote=null; pushOp({t:"dellot",id});
      stat(`'${이름}' 줄을 지웠습니다.`);
    }
    return;
  }
});

/* 날짜는 반드시 한국 시간으로 센다. toISOString() 은 세계표준시라
   한국 새벽(0~9시)에는 하루 전 날짜가 나온다. 경매는 새벽에 하므로,
   이걸 그냥 쓰면 같은 낙찰이 날짜만 다른 두 줄로 쌓인다. */
const 오늘KST=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
/* 경매일 = 경매가 끝나는 날. 경매는 밤 22:30 에 시작해 다음날 낮에 끝나므로, 15시 이후는 내일 날짜다.
   수집기(seowon_bridge.auction_date)가 두 시장 낙찰에 붙이는 날짜와 같은 규칙이다. */
const 경매일KST=()=>{ const k=new Date(Date.now()+9*3600e3);

const ago=t=>{

  if(s<60)return "방금";

};

/* 서버 상태를 화면 상태로 옮긴다 */
function applyServer(sv){
  state.lots=Object.values(sv.lots||{});
  state.got={}; Object.keys(sv.got||{}).forEach(k=>state.got[k]=sv.got[k].n);
  state.stampGot=sv.got||{};
  state.done={}; state.stampCar=sv.cars||{};
  Object.keys(sv.cars||{}).forEach(k=>state.done[k]=true);
  state.notes={}; state.stampNote=sv.notes||{};
  Object.keys(sv.notes||{}).forEach(k=>state.notes[k]=sv.notes[k].text);
  state.lotnotes=sv.lotnotes||{};
  state.pickup=sv.pickup||{}; state.reauc=sv.reauc||{}; state.fifo=sv.fifo||{}; state.prep=sv.prep||{};
  state.inv=sv.inv||{};
  state.lastLots=sv.lastLots||null;
  if(sv.now) clockSkew=sv.now-Date.now();
  pollers=sv.pollers||{}; renderSess();
  /* 누가 줄을 지웠거나 지난 날짜가 채워졌을 수 있으니, 보고 있는 날짜의 기록은 다시 받는다 */
  if(tab==="lot"&&lotDate&&sv.version!==lastSvVersion) loadCalDay(lotDate);
  lastSvVersion=sv.version;
  liveLog=sv.log||[];
  pending.forEach(o=>localEcho(o));      // 아직 서버에 못 보낸 내 조작은 화면에 유지
  /* 다른 사람이 전량 출고·되돌리기를 했을 수 있으니 출고 기록을 보고 있으면 다시 받는다 */
  if(tab==="inv"&&invMode==="shipped") loadShipped().then(()=>{ if(tab==="inv") render(); });
  save(); render();
  state.workday=sv.workday||state.workday;
  checkBuild(sv.build);
}

/* ---------- 경매 사이트 로그인 상태 (최상단 오른쪽 툴바) ----------
   사무실 PC 의 수집기가 몇 초마다 시장별로 '로그인 살아 있음/만료'를 보내온다(poll op).
   녹색 = 로그인 정상이고 신호도 최근에 옴, 빨강 = 로그인 만료(또는 확인 오류),
   회색 = 수집기 신호가 끊김(PC 꺼짐·프로그램 꺼짐·스케줄 시간 밖) — 이때는 세션 상태를 알 수 없다.
   폰 시계와 서버 시계가 달라도 틀리지 않게 서버 시각(now)과의 차이를 따로 잰다. */
let pollers={}, clockSkew=0;
function sessOf(m){
  const p=pollers[m];
  if(!p) return {cls:"none",txt:"신호 없음"};
  const age=Date.now()+clockSkew-p.at;
  const stale=Math.max(30e3,3*(p.interval||10)*1000);
  if(age>stale) return {cls:"none",txt:"신호 끊김",age};
  if(p.session==="ok") return {cls:"ok",txt:"로그인 정상",age};
  return {cls:"bad",txt:p.session==="expired"?"로그인 만료":"확인 오류",age};
}
const secAgo=ms=>ms==null?"-":ms<60e3?Math.round(ms/1000)+"초 전":ms<3600e3?Math.round(ms/60e3)+"분 전":Math.round(ms/3600e3)+"시간 전";
const hhmm=t=>t?new Date(t).toLocaleString("ko-KR",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"}):"-";
function renderSess(){
  document.querySelectorAll("#sessbar .sess").forEach(el=>{
    const s=sessOf(el.dataset.m);
    el.className="sess "+(s.cls==="ok"?"ok":s.cls==="bad"?"bad":"");
    el.title=el.dataset.m+" "+s.txt;
  });
  if(!document.getElementById("sesssheet").classList.contains("hidden")) renderSessSheet();
}
function renderSessSheet(){
  const ll=state.lastLots;
  document.getElementById("sessbody").innerHTML=["서울청과","동화청과"].map(m=>{
    const p=pollers[m]||{}, s=sessOf(m);
    return `<div class="sesscard"><b>${m}</b><span class="st ${s.cls}">● ${s.txt}</span><br>
      마지막 신호: ${p.at?secAgo(s.age)+" ("+hhmm(p.at)+")":"받은 적 없음"}<br>
      확인 간격: ${p.interval?p.interval+"초":"-"} · 화면 낙찰 줄: ${p.rows??"-"}<br>
      마지막 로그인 정상: ${hhmm(p.okAt)}${p.msg?`<br>메시지: ${esc(p.msg)}`:""}</div>`;}).join("")
    +`<p class="hint">회색은 수집기 신호가 끊긴 상태입니다 (PC·프로그램이 꺼졌거나, 스케줄 시간
      일~금 22:30~익일 새벽1:00 밖). 빨강이면 그 시장 사이트에 다시 로그인해야 합니다.<br>
      마지막 낙찰 수신: ${ll&&ll.at?hhmm(ll.at):"-"}${ll&&ll.lag!=null?` · 사이트에서 본 뒤 서버 도착까지 ${(ll.lag/1000).toFixed(1)}초`:""}</p>`;
}
document.getElementById("sessbar").onclick=()=>{ renderSessSheet(); document.getElementById("sesssheet").classList.remove("hidden"); };
document.getElementById("sessclose").onclick=()=>document.getElementById("sesssheet").classList.add("hidden");

/* ---------- 새 판 자동 적용 ----------
   서버가 화면 파일이 바뀔 때마다 다른 판 번호를 함께 내려보낸다.
   내가 켤 때 받은 번호와 달라지면 새로 올라온 것이니 스스로 받아 적용한다.
   다만 손대는 중에 화면이 튀면 안 되므로, 무언가 열려 있거나 아직 서버에
   못 보낸 조작이 남아 있으면 끝날 때까지 기다렸다가 적용한다. */
let myBuild=null, waitingBuild=null, buildTimer=null, lastSvVersion=null;

function busyNow(){
  if(pending.length) return true;                       // 아직 못 보낸 조작이 있다
  const open=id=>{const el=document.getElementById(id); return !!el&&!el.classList.contains("hidden");};
  if(open("pick")||open("dpick")) return true;
  const a=document.activeElement;
  return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}

function checkBuild(b){
  if(!b) return;
  if(!myBuild){ myBuild=b; return; }                    // 켤 때 받은 번호를 기준으로 삼는다
  if(b===myBuild||b===waitingBuild) return;
  waitingBuild=b;
  applyNewBuild();
}

function applyNewBuild(){
  if(!waitingBuild) return;
  if(busyNow()){
    document.getElementById("updbar").classList.remove("hidden");
    clearTimeout(buildTimer);
    buildTimer=setTimeout(applyNewBuild,3000);          // 손을 뗄 때까지 기다린다
    return;
  }
  location.reload();
}
document.getElementById("updbar").onclick=()=>location.reload();
function localEcho(op){
  if(op.t==="got") state.got[op.id]=op.n;
  if(op.t==="car"){ if(op.done) state.done[op.id]=true; else delete state.done[op.id]; }
  if(op.t==="note"){ if(op.text) state.notes[op.id]=op.text; else delete state.notes[op.id]; }
  if(op.t==="lotnote"){
    state.lotnotes=state.lotnotes||{};
    if(op.text) state.lotnotes[op.id]={text:op.text,by:me||"나",at:Date.now()};
    else delete state.lotnotes[op.id];
  }
  if(op.t==="lots"){                       // 서버가 없어도 내 화면에는 바로 들어가야 한다
    (op.rows||[]).forEach(r=>{
      const i=state.lots.findIndex(x=>x.id===r.id);
      if(i>=0) state.lots[i]=Object.assign({},state.lots[i],r);
      else state.lots.push(Object.assign({addedBy:me||"나",addedAt:Date.now()},r));
      if(state.got[r.id]>r.qty) state.got[r.id]=r.qty;
    });
  }
  if(op.t==="dellot"){
    state.lots=(state.lots||[]).filter(l=>l.id!==op.id);
    delete state.got[op.id]; if(state.lotnotes) delete state.lotnotes[op.id];
  }
  if(op.t==="clearlots"){ state.lots=[]; state.got={}; state.lotnotes={}; state.pickup={}; }
  if(op.t==="pickup"){ state.pickup=state.pickup||{}; if(op.on) state.pickup[op.id]={by:me,at:Date.now()}; else delete state.pickup[op.id]; }
  if(op.t==="prepsave"){ state.prep=state.prep||{}; const d=state.prep[op.date]=Object.assign({},state.prep[op.date]||{});
    if(op.on) d._saved={by:me||"나",at:Date.now()}; else delete d._saved; }
  if(op.t==="prep"){ state.prep=state.prep||{}; const d=state.prep[op.date]=state.prep[op.date]||{};
    const r=d[op.row]=Object.assign({},d[op.row]||{}); const v=op.value===""?null:Math.max(0,Math.round(Number(op.value)||0));
    if(v==null) delete r[op.col]; else r[op.col]=v; }
  if(op.t==="fifo"){ state.fifo=state.fifo||{}; const d=state.fifo[op.date]=state.fifo[op.date]||{};
    const c=Object.assign({},d[op.item]||{},{by:me,at:Date.now()});
    if("plan" in op) c.plan=op.plan===""?null:Math.max(0,Math.round(Number(op.plan)||0));
    if("memo" in op) c.memo=op.memo; if("done" in op) c.done=!!op.done; d[op.item]=c; }
  if(op.t==="reauc"){ state.reauc=state.reauc||{}; if(op.on) state.reauc[op.id]={by:me,at:Date.now()}; else delete state.reauc[op.id]; }
  state.inv=state.inv||{};
  if(op.t==="invlock"&&state.inv[op.id]){ const it=Object.assign({},state.inv[op.id]);
    if(op.on) it.lock={by:me||"나",at:Date.now()}; else delete it.lock; state.inv[op.id]=it; }
  if(op.t==="invleft"&&state.inv[op.id]&&!state.inv[op.id].lock) state.inv[op.id]=Object.assign({},state.inv[op.id],{left:op.left});
  if(op.t==="ship") delete state.inv[op.id];
  if(op.t==="dellot") delete state.inv[op.id];
  if(op.t==="newday"){ state.lots=[]; state.got={}; state.done={}; state.notes={}; state.pickup={}; }
}

function connect(){
  if(!serverUrl){ setConn(false,"서버 미설정"); return; }
  if(es) try{ es.close(); }catch(e){}
  setConn(false,"연결 중");
  es=new EventSource(serverUrl+"/api/stream");
  es.onopen=()=>{ setConn(true); retryMs=3000; flush(); };
  es.onmessage=e=>{ try{ applyServer(JSON.parse(e.data)); setConn(true); }catch(err){} };
  es.addEventListener("poll",e=>{ try{ const j=JSON.parse(e.data); pollers=j.pollers||{}; if(j.now) clockSkew=j.now-Date.now(); renderSess(); setConn(true); }catch(err){} });
  /* 브라우저는 끊긴 뒤 한 번 다시 붙어 보다가 서버가 아직 안 떠 있으면(재배포·재시작 중)
     연결을 아예 닫아 버리고 다시 시도하지 않는다. 그러면 새로고침 전까지 '오프라인'으로 멈추므로,
     닫혔으면 우리가 3초→6초→…최대 30초 간격으로 다시 붙는다. */
  es.onerror=()=>{ setConn(false); if(es.readyState===2) scheduleReconnect(); };
}
let retryMs=3000, retryTimer=null;
function scheduleReconnect(){
  if(retryTimer) return;
  retryTimer=setTimeout(()=>{ retryTimer=null; connect(); },retryMs);
  retryMs=Math.min(30000,retryMs*2);
}
/* 폰 화면을 다시 켰을 때 연결이 끊겨 있으면 기다리지 않고 바로 다시 붙는다 */
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible" && serverUrl && (!es||es.readyState===2)){
    clearTimeout(retryTimer); retryTimer=null; retryMs=3000; connect();
  }
});

async function flush(){
  if(!serverUrl||!pending.length) return;
  const batch=pending.slice();
  try{
    const r=await fetch(serverUrl+"/api/op",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({user:me,ops:batch})});
    if(!r.ok) throw new Error();
    pending=pending.slice(batch.length); savePending(); setConn(true);
  }catch(e){ setConn(false); }
}
function pushOp(op,quiet){
  localEcho(op); save(); if(!quiet) render();     // quiet: 칸에 적는 중 — 화면을 다시 그리면 다음 칸으로 옮긴 손가락이 튕긴다
  if(!serverUrl) return;                   // 서버를 안 쓰면 이 폰에만 저장된다
  pending.push(op); savePending(); flush();
}
setInterval(()=>{ if(pending.length) flush(); },4000);
window.addEventListener("online",()=>{ flush(); connect(); });

/* ---------- 새 낙찰 알림 ----------
   · 아이폰(홈 화면에 추가한 앱)·크롬: 웹 푸시. 처음 한 번 '알림을 받으시겠어요?'를 묻고, 허용하면
     구독 정보를 서버에 맡긴다(/api/push/subscribe). 앱을 닫아 둬도 알림이 온다.
   · 안드로이드 서원농산 앱(APK): 웹뷰는 웹 푸시를 못 받으므로 앱(SeowonApp)이 직접 묻고 띄운다.
     여기서는 그 상태만 보여주고 켜기·시험을 앱에 맡긴다. */
const NKEY="seowon-notif-asked";
const inApk=()=>!!(window.SeowonApp&&window.SeowonApp.notifyState);
const webPushOK=()=>"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window;
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
const standalone=window.navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;
function urlB64(s){ const p="=".repeat((4-s.length%4)%4), b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));
  return Uint8Array.from(b,c=>c.charCodeAt(0)); }
function notifState(){
  if(inApk()) return window.SeowonApp.notifyState();          // on | off | denied
  if(!webPushOK()) return "unsupported";
  return Notification.permission==="granted"?"on":Notification.permission==="denied"?"denied":"off";
}
async function subscribePush(){
  const perm=await Notification.requestPermission();           // 반드시 버튼을 누른 그 순간에 물어야 한다(아이폰)
  if(perm!=="granted") return false;
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub){
    const k=await (await fetch(serverUrl+"/api/push/key")).json();
    sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64(k.key)});
  }
  await fetch(serverUrl+"/api/push/subscribe",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({user:me,sub:sub.toJSON()})});
  return true;
}
async function unsubscribePush(){
  const reg=await navigator.serviceWorker.ready, sub=await reg.pushManager.getSubscription();
  if(!sub) return;
  await fetch(serverUrl+"/api/push/unsubscribe",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({endpoint:sub.endpoint})});
  await sub.unsubscribe();
}
function renderBell(){
  const st=notifState(), b=document.getElementById("bellbtn");
  b.textContent=st==="on"?"🔔 알림 켜짐":"🔕 알림 꺼짐";
  b.classList.toggle("bellon",st==="on");
}
function openNotif(){
  const st=notifState(), t=document.getElementById("notiftext"), box=document.getElementById("notifbtns");
  let msg="", btns="";
  if(st==="unsupported"){
    msg=isIOS&&!standalone
      ?"아이폰은 사파리에서 <b>공유 → 홈 화면에 추가</b>로 만든 앱에서만 알림을 받을 수 있습니다. 홈 화면의 SEOWONY(고추) 아이콘으로 열어 주세요. (iOS 16.4 이상)"
      :"이 브라우저는 알림을 받을 수 없습니다.";
  } else if(st==="denied"){
    msg=inApk()?"알림이 꺼져 있습니다. 휴대폰 <b>설정 → 애플리케이션 → SEOWONY → 알림</b>에서 허용해 주세요."
      :"알림을 거절해 두셨습니다. <b>설정 → 알림 → SEOWONY</b>에서 허용으로 바꾼 뒤 다시 눌러 주세요.";
    btns=inApk()?`<button class="bigbtn accent" data-n="on">알림 다시 켜기</button>`:"";
  } else if(st==="on"){
    msg="새 낙찰이 들어오면 이 휴대폰에 알림이 옵니다. 앱을 닫아 두어도 옵니다.";
    btns=`<button class="bigbtn" data-n="test">시험 알림 보내기 (모두에게)</button><button class="bigbtn" data-n="off">이 휴대폰 알림 끄기</button>`;
  } else {
    msg="새 낙찰이 들어올 때마다 이 휴대폰에 알림을 받으시겠어요? 앱을 닫아 두어도 옵니다.";
    btns=`<button class="bigbtn accent" data-n="on">알림 받기</button><button class="bigbtn" data-n="later">나중에</button>`;
  }
  t.innerHTML=msg; box.innerHTML=btns;
  document.getElementById("notifsheet").classList.remove("hidden");
}
document.getElementById("bellbtn").onclick=openNotif;
document.getElementById("notifclose").onclick=()=>document.getElementById("notifsheet").classList.add("hidden");
document.getElementById("notifbtns").addEventListener("click",async e=>{
  const b=e.target.closest("[data-n]"); if(!b) return;
  const a=b.dataset.n; localStorage.setItem(NKEY,"1");
  try{
    if(a==="on"){ if(inApk()) window.SeowonApp.requestNotify(); else if(!(await subscribePush())) alert("알림이 허용되지 않았습니다."); }
    if(a==="off"){ if(inApk()) window.SeowonApp.disableNotify(); else await unsubscribePush(); }
    if(a==="test"){ const r=await (await fetch(serverUrl+"/api/push/test",{method:"POST"})).json();
      alert(`시험 알림을 보냈습니다 (아이폰·브라우저 ${r.웹푸시}대, 안드로이드 앱 ${r.앱}대)`); }
  }catch(err){ alert("알림 설정 중 문제가 생겼습니다: "+err.message); }
  document.getElementById("notifsheet").classList.add("hidden");
  setTimeout(renderBell,500);
});
/* 안드로이드 앱이 알림 상태가 바뀌면 불러 준다 */
window.onNotifyChanged=renderBell;
/* 처음 한 번 묻는다 (안드로이드 앱은 앱이 직접 묻는다). 이미 허용했으면 구독을 서버에 다시 알려 둔다. */
function askNotifOnce(){
  renderBell();
  if(inApk()||!me) return;
  const st=notifState();
  if(st==="on"){ subscribePush().catch(()=>{}); return; }
  if(st==="off"&&!localStorage.getItem(NKEY)) setTimeout(openNotif,800);
}

/* ---------- 이름 고르기 ----------
   사무실에서 쓰는 다섯 사람. 예전 A·B·C 로 골라 둔 폰은 켤 때 다시 고르게 한다. */
const USERS=["호열","상혁","상용","부장님","사장님"];
function openPick(){
  const box=document.getElementById("pickbtns");
  box.innerHTML=USERS.map(n=>`<button class="pickbtn ${me===n?"on":""}" data-n="${esc(n)}">${esc(n)}</button>`).join("");
  document.getElementById("pickcustom").value=(USERS.includes(me)||["A","B","C"].includes(me)?"":me);
  document.getElementById("pickserver").value=localStorage.getItem(SKEY)||"";
  document.getElementById("pick").classList.remove("hidden");
}
document.getElementById("pickbtns").addEventListener("click",e=>{
  const b=e.target.closest("[data-n]"); if(!b)return;
  me=b.dataset.n; document.getElementById("pickcustom").value="";
  document.querySelectorAll("#pickbtns .pickbtn").forEach(x=>x.classList.toggle("on",x.dataset.n===me));
});
document.getElementById("pickok").onclick=()=>{
  const custom=document.getElementById("pickcustom").value.trim();
  if(custom) me=custom.slice(0,12);
  if(!me){ alert("이름을 고르거나 입력해 주세요."); return; }
  const sv=document.getElementById("pickserver").value.trim().replace(/\/$/,"");
  if(sv){ serverUrl=sv; localStorage.setItem(SKEY,sv); }
  localStorage.setItem(UKEY,me);
  document.getElementById("mename").textContent=me;
  document.getElementById("pick").classList.add("hidden");
  connect();
  askNotifOnce();
};
document.getElementById("mename").onclick=openPick;
document.getElementById("connstat").onclick=openPick;

if(["A","B","C"].includes(me)){ me=""; localStorage.removeItem(UKEY); }
document.getElementById("mename").textContent=me||"이름";
if(!me) openPick(); else { connect(); askNotifOnce(); }

render(); renderFooter();

/* 오프라인 대비 — 한 번 열어두면 신호가 약해도 화면은 뜬다.
   담아두기 규칙은 sw.js 에 있다. 화면은 서버 우선이라 새 판이 늦게 오는 일은 없다. */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      setInterval(()=>{ try{ reg.update(); }catch(e){} }, 30*60e3);
    }).catch(()=>{});
  });
}
</script>
