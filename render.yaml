# Render 배포 설정 (Blueprint)
# 대시보드에서 손으로 만들 때는 이 값들을 그대로 넣으면 된다.
services:
  - type: web
    name: seowon-check
    runtime: node
    plan: free
    region: singapore        # 한국에서 가장 가까운 지역
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    # 자료를 배포 후에도 남기려면 Starter 이상으로 올리고 디스크를 붙인 뒤,
    # 환경변수 DATA_DIR 를 디스크 경로로 지정한다. (무료 플랜에는 디스크를 붙일 수 없다)
    #   disk:
    #     name: seowon-data
    #     mountPath: /var/data
    #     sizeGB: 1
    #   envVars:
    #     - key: DATA_DIR
    #       value: /var/data
    # 가격 정보(도·소매·경락 단가) 자동 수집 — 대시보드 Environment 에 직접 넣는다(값은 저장소에 적지 않음)
    #   DATA_GO_KR_KEY   공공데이터포털 '전국 공영도매시장 실시간 경매정보' 인증키
    #   KAMIS_CERT_KEY   KAMIS Open-API 인증키
    #   KAMIS_CERT_ID    KAMIS Open-API 신청 아이디
