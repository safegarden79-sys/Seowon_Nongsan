<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>지역별 소매가격</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<main>
  <h1>지역별 소매가격</h1>
  <p class="lead">KAMIS(aT 농산물유통정보)가 지역별 마트·시장에서 조사한 소매가격입니다. 매일 자동으로 받아 쌓고, 같은 날 공영도매시장 경락가와 견줘 "도매 대비 몇 배"인지 보여줍니다.</p>
  <div id="banners"></div>

  <div class="card">
    <div class="row">
      <label class="f">품목<select id="grp"></select></label>
      <label class="f">소매 등급<span class="seg" id="rank"><button data-v="상품" class="on">상품</button><button data-v="중품">중품</button></span></label>
    </div>
    <p class="note" id="status" style="margin:10px 0 0"></p>
  </div>

  <div class="grid kpis" id="kpis"></div>

  <div class="card">
    <h2>지역별 최근 소매가 <span class="note" id="asof"></span></h2>
    <div class="scroll" id="table"></div>
  </div>

  <div class="card">
    <h2>kg당 소매가 추이 <span class="note">점선은 전국 공영도매시장 경락가(상)</span></h2>
    <div id="chart"></div>
  </div>
</main>
<script src="common.js"></script>
<script>
const { $, esc, won, j, kstToday, addDays, ago, lineChart, COLORS } = PX;
PX.nav("retail.html");
let META, ST, RT = {}, WS = {};
const ui = { group: "cheongyang", rank: "상품" };

function pick(rows) { return rows.find(r => r.rank && r.rank.includes(ui.rank)) || null; }
function wsAvg(group, grade, fromDay, toDay) {
  let q = 0, s = 0;
  for (const [d, day] of Object.entries(WS)) {
    if (d < fromDay || d > toDay) continue;
    const r = day.agg && day.agg[group] && day.agg[group][grade]; if (!r) continue;
    for (const m of Object.values(r)) { q += m.q; s += m.s; }
  }
  return q ? s / q : NaN;
}
function draw() {
  const g = ui.group, days = Object.keys(RT).sort();
  const latest = [...days].reverse().find(d => Object.values(RT[d].regions || {}).some(r => (r.items[g] || []).length));
  const proxy = META.retailProxy[g];
  if (!latest) { $("#table").innerHTML = `<div class="empty">이 품목의 소매 자료가 아직 없습니다</div>`; $("#kpis").innerHTML = ""; lineChart($("#chart"), { series: [], xs: [] }); return; }
  $("#asof").textContent = `${latest} 기준` + (proxy ? ` · 소매 조사에 없어 '${proxy}'로 대신 표시` : "");
  const ws = wsAvg(g, "상", addDays(latest, -6), latest);
  const rows = [];
  for (const [code, reg] of Object.entries(RT[latest].regions || {})) {
    const r = pick(reg.items[g] || []); if (!r) continue;
    rows.push({ name: reg.name, ...r });
  }
  rows.sort((a, b) => (a.perKg || a.price) - (b.perKg || b.price));
  const kgVals = rows.map(r => r.perKg).filter(Boolean).sort((a, b) => a - b);
  const med = kgVals.length ? kgVals[Math.floor(kgVals.length / 2)] : NaN;
  $("#kpis").innerHTML = [
    ["소매 kg당 (지역 가운데값)", won(med), `${kgVals.length}개 지역 · ${ui.rank}`],
    ["도매 kg당 (최근 7일, 상)", won(ws), "공영도매시장 가중평균"],
    ["소매 ÷ 도매", isFinite(med / ws) ? (med / ws).toFixed(2) + "배" : "—", "유통 단계에서 붙는 값"],
    ["가장 싼 / 비싼 지역", rows.length ? `${esc(rows[0].name)} · ${esc(rows[rows.length - 1].name)}` : "—", ""],
  ].map(([l, v, s]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("");
  const chg = (a, b) => a && b ? `<span class="${a > b ? "up" : "down"}">${a > b ? "▲" : "▼"}${Math.abs((a / b - 1) * 100).toFixed(1)}%</span>` : "—";
  $("#table").innerHTML = `<table><tr><th>지역</th><th>조사 단위</th><th>가격</th><th>kg당</th><th>1주 전</th><th>1달 전</th><th>1년 전</th><th>평년</th><th>도매 대비</th></tr>` +
    rows.map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.unit)}</td><td>${won(r.price)}</td><td><b>${won(r.perKg)}</b></td><td>${won(r.w)} ${chg(r.price, r.w)}</td><td>${won(r.m)}</td><td>${won(r.y)}</td><td>${won(r.avg)}</td><td>${r.perKg && ws ? (r.perKg / ws).toFixed(2) + "배" : "—"}</td></tr>`).join("") + `</table>
    <p class="note">'평년'은 KAMIS가 주는 최근 5년 평균값입니다. 단위가 '개'로 조사되는 품목은 kg 환산을 하지 않습니다.</p>`;
  /* 그래프: 자료가 많은 지역 6곳 + 도매 */
  const byReg = {};
  for (const d of days) for (const reg of Object.values(RT[d].regions || {})) {
    const r = pick(reg.items[g] || []); if (r && r.perKg) (byReg[reg.name] ||= []).push([d, r.perKg]);
  }
  const top = Object.entries(byReg).sort((a, b) => b[1].length - a[1].length).slice(0, 6);
  const wsPts = days.map(d => [d, wsAvg(g, "상", d, d)]).filter(p => isFinite(p[1]));
  lineChart($("#chart"), { xs: days, series: [...top.map(([n, pts], i) => ({ name: n, color: COLORS[i % COLORS.length], points: pts })), { name: "도매 경락가(상)", color: "#183A22", dash: "5 4", w: 2.6, points: wsPts }] });
}

(async () => {
  try {
    [META, ST] = await Promise.all([j("/api/prices/meta"), j("/api/prices/status")]);
    const [r, w] = await Promise.all([j("/api/prices/retail?days=100"), j("/api/prices/wholesale?days=100")]);
    RT = r.days; WS = w.days;
  } catch (e) { $("#status").textContent = "자료를 불러오지 못했습니다: " + e.message; return; }
  PX.banners(ST, $("#banners"));
  if (!ST.keys.kamis && !ST.mock) $("#banners").insertAdjacentHTML("beforeend", `<div class="banner warn">KAMIS 인증키(KAMIS_CERT_KEY · KAMIS_CERT_ID)가 서버에 없어 자동 수집이 꺼져 있습니다. kamis.or.kr 에서 Open-API 이용 신청 후 Render 환경변수에 넣어 주세요.</div>`);
  if (ST.retail.error) $("#banners").insertAdjacentHTML("beforeend", `<div class="banner warn">최근 수집 오류: ${esc(ST.retail.error.msg)}</div>`);
  $("#grp").innerHTML = META.groups.map(g => `<option value="${g.key}">${esc(g.name)}</option>`).join("");
  $("#grp").addEventListener("change", e => { ui.group = e.target.value; draw(); });
  $("#rank").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; [...$("#rank").children].forEach(x => x.classList.toggle("on", x === b)); ui.rank = b.dataset.v; draw(); });
  $("#status").textContent = `소매 자료 ${ST.retail.days}일치 · 마지막 수집 ${ago(ST.retail.last)} · 매일 오후 자동 갱신`;
  draw();
  addEventListener("resize", draw);
})();
</script>
</body>
</html>
